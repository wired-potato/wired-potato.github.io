<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrolling Credits with Shooting</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
            background-color: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        .credits {
            position: absolute;
            bottom: -100%;
            width: 100%;
            text-align: center;
            animation: scrollCredits 20s linear infinite;
        }
        @keyframes scrollCredits {
            from {
                bottom: -100%;
            }
            to {
                bottom: 100%;
            }
        }
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="credits">
        <h1>Credits</h1>
        <p>Director: John Doe</p>
        <p>Producer: Jane Smith</p>
        <p>Lead Developer: Alice Johnson</p>
        <p>Designer: Bob Brown</p>
        <!-- Add more credits as needed -->
    </div>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const spaceship = new Image();
        spaceship.src = 'Images/Spaceship.png';

        const bulletImg = new Image();
        bulletImg.src = 'Images/Bullet.png';

        const spaceshipWidth = 50;
        const spaceshipHeight = 50;
        let spaceshipX = (canvas.width - spaceshipWidth) / 2;
        let spaceshipY = canvas.height - spaceshipHeight - 10;

        const bullets = [];
        const bulletWidth = 5;
        const bulletHeight = 10;
        const bulletSpeed = 5;

        let creditsElements = document.querySelectorAll('.credits p');

        function drawSpaceship() {
            ctx.drawImage(spaceship, spaceshipX, spaceshipY, spaceshipWidth, spaceshipHeight);
        }

        function drawBullets() {
            bullets.forEach((bullet, index) => {
                bullet.y -= bulletSpeed;
                if (bullet.y + bulletHeight < 0) {
                    bullets.splice(index, 1);
                }
                ctx.drawImage(bulletImg, bullet.x, bullet.y, bulletWidth, bulletHeight);

                // Collision detection with credits
                creditsElements.forEach((credit, idx) => {
                    const rect = credit.getBoundingClientRect();
                    if (bullet.x < rect.right && bullet.x + bulletWidth > rect.left &&
                        bullet.y < rect.bottom && bullet.y + bulletHeight > rect.top) {
                        credit.style.visibility = 'hidden';
                        bullets.splice(index, 1);
                    }
                });
            });
        }

        function shoot() {
            bullets.push({ x: spaceshipX + spaceshipWidth / 2 - bulletWidth / 2, y: spaceshipY });
        }

        const keys = {
            w: false,
            a: false,
            s: false,
            d: false
        };

        window.addEventListener('keydown', (e) => {
            if (e.key === ' ') {
                shoot();
            } else {
                keys[e.key] = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (keys.w && spaceshipY > 0) {
                spaceshipY -= 5;
            }
            if (keys.s && spaceshipY < canvas.height - spaceshipHeight) {
                spaceshipY += 5;
            }
            if (keys.a && spaceshipX > 0) {
                spaceshipX -= 5;
            }
            if (keys.d && spaceshipX < canvas.width - spaceshipWidth) {
                spaceshipX += 5;
            }

            drawSpaceship();
            drawBullets();
            requestAnimationFrame(update);
        }

        spaceship.onload = () => {
            update();
        };
    </script>
</body>
</html>
